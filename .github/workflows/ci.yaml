name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "VERSION"
      - "CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "VERSION"
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [start-ci]

env:
  MIX_ENV: test
  NODEJS_BC: "22.15.1"
  POSTGRES_VERSION: "17.5" # https://registry.suse.com/repositories/suse-postgres17?tag=17.5
  RABBITMQ_VERSION: "3.12.6-management-alpine" # https://github.com/trento-project/helm-charts/blob/main/charts/trento-server/charts/rabbitmq/values.yaml
  OPENAPI_DIFF_VERSION: "2.1.7" # https://github.com/OpenAPITools/openapi-diff/releases

jobs:
  elixir-toolchain:
    name: Elixir toolchain
    uses: trento-project/.github/.github/workflows/elixir-toolchain.yaml@shared-elixir-otp-toolchain-matrix

  setup-matrix-env:
    runs-on: ubuntu-24.04
    outputs:
      RUST_DEV: ${{ env.RUST_VERSION }}
      POSTGRES_VERSION: ${{ env.POSTGRES_VERSION }}
      RABBITMQ_VERSION: ${{ env.RABBITMQ_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gather versions
        uses: endorama/asdf-parse-tool-versions@115a5df5884438dfd08a3a21e9c9efdf06dd907e # v1.7.0
      - name: Compute matrix
        run: |
          echo "RUST_DEV=${{ env.RUST_VERSION }}" >> $GITHUB_OUTPUT
          echo "POSTGRES_VERSION=${{ env.POSTGRES_VERSION }}" >> $GITHUB_OUTPUT
          echo "RABBITMQ_VERSION=${{ env.RABBITMQ_VERSION }}" >> $GITHUB_OUTPUT

  elixir-deps:
    name: Elixir dependencies
    needs: [elixir-toolchain, setup-matrix-env]
    uses: trento-project/.github/.github/workflows/elixir-deps.yaml@shared-elixir-otp-toolchain-matrix
    with:
      toolchains: ${{ needs.elixir-toolchain.outputs.TOOLCHAINS }}
      mix_envs: '["test","prod"]'
      cache_key_suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      env: >-
        ${{ format('{{"RHAI_RUSTLER_FORCE_BUILD": "true", "RUSTUP_TOOLCHAIN": "{0}"}}', needs.setup-matrix-env.outputs.RUST_DEV) }}

  static-code-analysis:
    name: Static Code Analysis (Elixir ${{ matrix.toolchain.elixir }})
    needs: [elixir-toolchain, setup-matrix-env, elixir-deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Elixir and restore cached dependencies
        id: mix-cache
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      - name: Check for Unused Dependencies
        run: mix deps.unlock --check-unused
      - name: Check Code Format
        run: mix format --check-formatted
      - name: Run Credo
        run: mix credo --strict
      - name: Run Dialyzer
        run: mix dialyzer
      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        name: Check license headers

  test:
    name: Test (Elixir ${{ matrix.toolchain.elixir }})
    needs: [elixir-toolchain, setup-matrix-env, elixir-deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}
    services:
      postgres:
        image: registry.suse.com/suse/postgres:${{ needs.setup-matrix-env.outputs.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wanda_test
        ports:
          - 5434:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:${{ needs.setup-matrix-env.outputs.RABBITMQ_VERSION }}
        env:
          RABBITMQ_DEFAULT_USER: wanda
          RABBITMQ_DEFAULT_PASS: wanda
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5674:5672
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Elixir and restore cached dependencies
        id: mix-cache
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Create and migrate database
        run: mix ecto.create && mix ecto.migrate
      - name: Run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mix coveralls.github --warnings-as-errors --color --trace

  target-branch-deps:
    name: Target branch dependencies
    needs: [elixir-toolchain, setup-matrix-env]
    if: github.event_name == 'pull_request'
    uses: trento-project/.github/.github/workflows/elixir-deps.yaml@shared-elixir-otp-toolchain-matrix
    with:
      toolchains: ${{ needs.elixir-toolchain.outputs.TOOLCHAINS }}
      mix_envs: '["test"]'
      checkout_ref: ${{ github.event.pull_request.base.ref }}
      cache_key_suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      env: >-
        ${{ format('{{"RHAI_RUSTLER_FORCE_BUILD": "true", "RUSTUP_TOOLCHAIN": "{0}"}}', needs.setup-matrix-env.outputs.RUST_DEV) }}

  test-release:
    name: Test release build (Elixir ${{ matrix.toolchain.elixir }})
    needs: [elixir-toolchain, setup-matrix-env, elixir-deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}
    env:
      MIX_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Elixir and restore cached dependencies
        id: mix-cache
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      - name: Build release
        run: mix release
      - name: Start release
        run: |
          export CORS_ORIGIN=localhost
          export SECRET_KEY_BASE=OxpmZytAd3dCb8heWykxY02zDQaNeDINbYK0ZCYxVn/xd+Vawc3JFiOLv5kwVBfARp3OT8mWqal0F45AiNP2QA==
          export AMQP_URL=amqp://trento_user:trento_user_password@rabbitmq-host/vhost
          export DATABASE_URL=ecto://wanda_user:wanda_password@postgres-host/wanda
          export AUTH_SERVER_URL=http://localhost:4000
          _build/prod/rel/wanda/bin/wanda eval "IO.puts(:ok)"
  api-docs-check:
    name: API docs check (Elixir ${{ matrix.toolchain.elixir }})
    needs: [elixir-toolchain, setup-matrix-env, elixir-deps]
    if: github.event_name == 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Elixir and restore cached dependencies - current branch
        id: mix-cache-current
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODEJS_BC }}
      - name: Install API linting tools
        run: |
          npm install -g @redocly/cli@latest
          npm install -g @quobix/vacuum@latest
          npm install -g @stoplight/spectral-cli
      - name: Run API docs check
        run: ./hack/api_docs_check.sh

  api-bc-check:
    name: API bc check (${{ matrix.version }}, Elixir ${{ matrix.toolchain.elixir }})
    needs: [elixir-toolchain, setup-matrix-env, elixir-deps, target-branch-deps]
    if: github.event_name == 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [Unversioned, V1, V2, V3]
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Elixir and restore cached dependencies - current branch
        id: mix-cache-current
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      - name: Generate current openapi.json
        run: |
          mix openapi.spec.json --start-app=false --spec WandaWeb.Schemas.${{ matrix.version }}.ApiSpec /tmp/specs/current-spec.json
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - name: Retrieve Elixir Cached Dependencies - target branch
        id: mix-cache-target
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
          setup-beam: "false"
      - name: Install missing dependencies
        if: steps.mix-cache-target.outputs.cache-hit != 'true'
        run: mix deps.get
      - name: Generate target openapi.json
        run: |
          mix openapi.spec.json --start-app=false --spec WandaWeb.Schemas.${{ matrix.version }}.ApiSpec /tmp/specs/target-spec.json
      - name: Locate generated specs
        run: mv /tmp/specs .
      - name: Find difference between OpenAPI specifications
        run: |
          docker run -v "$(pwd)/specs:/specs" --rm openapitools/openapi-diff:${{ env.OPENAPI_DIFF_VERSION }} \
            /specs/target-spec.json \
            /specs/current-spec.json \
            --fail-on-incompatible \
            --markdown /specs/changes.md \
            --text /specs/changes.txt \
            --html /specs/changes.html
      - name: Upload OpenAPI diff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: openapi-diff-report-${{ matrix.version }}
          path: specs/

  publish-containers:
    name: Publish GHCR Containers
    needs:
      - static-code-analysis
      - test
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mix_env: prod
            tag: "${{ (github.event_name == 'push' && github.ref_name == 'main' && 'rolling') || github.sha }}"
          - mix_env: demo
            tag: demo
    uses: trento-project/.github/.github/workflows/publish-containers.yaml@d8679bc6bc759e119793a2d59285098613f52055 # v1.10.0
    with:
      image_name: trento-wanda
      tag: ${{ matrix.tag }}
      extra_build_args: |
        MIX_ENV=${{ matrix.mix_env }}
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      ssh_key: ${{ secrets.TRENTOBOT_SSH_KEY }}

  deploy-demo:
    runs-on: ubuntu-24.04
    if: vars.DEPLOY_DEMO == 'true'
    needs:
      - publish-containers
    steps:
      - name: Remotely trigger trento-web demo deployment
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.TRENTOBOT_GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.DEMO_TRIGGER_TARGET || 'web' }}
          event-type: deploy-demo

  generate-docs:
    name: Generate project documentation
    needs: [elixir-toolchain, setup-matrix-env]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Elixir and restore cached dependencies
        id: mix-cache
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ needs.elixir-toolchain.outputs.ERLANG_DEV }}
          elixir-version: ${{ needs.elixir-toolchain.outputs.ELIXIR_DEV }}
          cache-key-suffix: rust-${{ needs.setup-matrix-env.outputs.RUST_DEV }}
      - name: Build docs
        uses: lee-dohm/generate-elixir-docs@a745603eef443621976df401f45aaff4d849056b # v1
      - name: Generate openapi.json
        run: mix openapi.spec.json --start-app=false --spec WandaWeb.Schemas.All.ApiSpec
      - name: Generate Swagger UI
        uses: Legion2/swagger-ui-action@eff65dc3f193f0a749872be82f74baa35be0797d # v1
        with:
          output: ./doc/swaggerui
          spec-file: openapi.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc

  obs-sync:
    name: OBS sync
    if: >-
      fromJSON(vars.OBS_ENABLED)
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: trento-project/.github/.github/workflows/obs-sync.yaml@d8679bc6bc759e119793a2d59285098613f52055 # v1.10.0
    needs:
      - static-code-analysis
      - test
    with:
      obs_project: ${{ vars.OBS_PROJECT_ROLLING }}
      obs_package: ${{ vars.OBS_PACKAGE }}
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      obs_user: ${{ secrets.OBS_USER }}
      obs_pass: ${{ secrets.OBS_PASS }}
      obs_ssh_key: ${{ secrets.OBS_SSH_KEY }}

  dependabot-auto-merge:
    name: Approve and merge Dependabot PRs
    if: >
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - static-code-analysis
      - test
      - test-release
      - api-docs-check
      - api-bc-check
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: trento-project/.github/.github/workflows/dependabot-auto-merge.yaml@main # v1.9.0
